spring:
  # DB 정보는 application-secret.yml의 prod 프로파일에서 가져옵니다
  datasource:
    driver-class-name: org.postgresql.Driver
    # url, username, password는 application-secret.yml의 prod 프로파일에서 가져옵니다

  security:
    oauth2:
      client:
        registration:
          google:
            # client-id, client-secret은 application-secret.yml의 prod 프로파일에서 가져옵니다
            scope:
              - profile
              - email
          naver:
            # client-id, client-secret은 application-secret.yml의 prod 프로파일에서 가져옵니다
            client-authentication-method: post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
          kakao:
            # client-id, client-secret은 application-secret.yml의 prod 프로파일에서 가져옵니다
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: 8080

zincsearch:
  url: ${ZINCSEARCH_URL:http://localhost:4080}
  index: products
  username: ${ZINCSEARCH_USER:admin}
  password: ${ZINCSEARCH_PASSWORD:Complexpass#123}
