spring:
  profiles:
    active: dev   # 기본 active → 개발 환경
    group:
      dev:
        - secret
      prod:
        - secret

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  jackson:
    serialization:
      indent-output: true

# OAuth 설정
oauth:
  # FE OAuth 콜백 기본 URL (SuccessHandler에서 사용)
  callback-base-url: http://localhost:5173/oauth/callback
  allowed-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173

logging:
  level:
    root: INFO
    com.usinsa.backend.domain.auth.oauth: DEBUG  # OAuth 상세 로그
