spring:
  # DB 정보는 application-secret.yml에서 가져옵니다
  datasource:
    driver-class-name: org.h2.Driver
    # url, username, password는 application-secret.yml의 dev 프로파일에서 가져옵니다

  # 세션 설정
  session:
    timeout: 30m  # 세션 타임아웃: 30분 (비회원 장바구니 보관 기간)
    # 프로덕션에서는 Redis 등 외부 저장소 사용 권장
    # store-type: redis

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      password: ${redis.password}

    elasticsearch:
      repositories:
        enabled: true
      uris: http://localhost:9200
      username:
      password:

  security:
    oauth2:
      client:
        registration:
          google:
            # client-id, client-secret은 application-secret.yml의 dev 프로파일에서 가져옵니다
            scope:
              - profile
              - email
          naver:
            # client-id, client-secret은 application-secret.yml의 dev 프로파일에서 가져옵니다
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver
          kakao:
            # client-id, client-secret은 application-secret.yml의 dev 프로파일에서 가져옵니다
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: Kakao
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  group-configs:
    - group: apiV1
      paths-to-match:
        - /api/v1/**

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true  # JavaScript에서 쿠키 접근 불가 (XSS 방지)
        secure: false    # 개발 환경은 HTTP, 프로덕션은 true로 설정
        same-site: lax   # CSRF 공격 방지