spring:
  profiles:
    active: test

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  session:
    timeout: 5m  # 테스트용 짧은 타임아웃

  elasticsearch:
    enabled: false

  h2:
    console:
      enabled: false
