name: build-and-release

on:
  push:
    branches:
      - '**'                    # 모든 브랜치에서 잡은 시작
      # 필요하면 좁히기: - develop / - main 등

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: usinsa-be      # ECR 리포지토리명 (존재 안 하면 생성)
  INFRA_REPO: usinsa/usinsa-infra

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      IMAGE_TAG: ${{ steps.meta.outputs.IMAGE_TAG }}
      REGISTRY:  ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      # ── AWS 자격증명(Access Key) 구성 ───────────────────────────────
      - name: Configure AWS credentials (Access Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # ── ECR 로그인 ──────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── ECR 리포지토리 없으면 생성 ──────────────────────────────────
      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY }}" \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      # ── 이미지 태그 설정(짧은 SHA 12자리) ─────────────────────────────
      - name: Set image tag
        id: meta
        run: echo "IMAGE_TAG=$(echo ${GITHUB_SHA} | cut -c1-12)" >> $GITHUB_OUTPUT

      # ── Docker Buildx 준비 ──────────────────────────────────────────
      - uses: docker/setup-buildx-action@v3

      # ── 이미지 빌드 & 푸시 (모든 브랜치에서 빌드는 하지만 푸시는 선택) ───
      - name: Build image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.IMAGE_TAG }}"
          docker build -t "$IMAGE" .

      # 트리거가 아닌 'develop'브랜치에서만 푸시하고 싶다면 if 조건을 추가하세요.
      - name: Push image
        # if: ${{ github.ref == 'refs/heads/develop' }}   # ← 개발 정책에 맞게 on/off
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.IMAGE_TAG }}"
          docker push "$IMAGE"

  open-infra-pr:
    # ✅ 같은 push 트리거에서 실행되지만, PR 생성은 develop에서만
    if: ${{ github.ref == 'refs/heads/develop' }}
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 브랜치 생성/커밋
      pull-requests: write     # PR 생성
    steps:
      - name: Checkout infra repo (main)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}            # ex) usinsa/usinsa-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}       # PAT 또는 App 토큰(타겟 레포 write 권한)
          ref: main

      - name: Configure git user
        run: |
          git config user.name  "usinsa-ci"
          git config user.email "ci@users.noreply.github.com"

      - name: Update image_tag in tfvars
        run: |
          FILE="envs/dev/terraform.tfvars"             # infra 레포 실제 경로 확인 필수
          test -f "$FILE"
          TAG="${{ needs.build-push.outputs.IMAGE_TAG }}"
          sed -i "s/^image_tag *= *.*/image_tag = \"${TAG}\"/" "$FILE"
          echo "Updated $FILE to image_tag=${TAG}"
          git status --porcelain

      - name: Create PR in infra repo
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          branch: chore/bump-image-${{ github.sha }}
          commit-message: "chore: bump image to ${{ github.sha }}"
          title: "chore(dev): bump image to ${{ github.sha }}"
          body: |
            Auto-bump image tag to `${{ github.sha }}` (short: `${{ needs.build-push.outputs.IMAGE_TAG }}`)
            Registry: `${{ needs.build-push.outputs.REGISTRY }}`, Repo: `${{ env.ECR_REPOSITORY }}`
          labels: |
            deploy
            automation
