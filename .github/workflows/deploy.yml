name: Fly Deploy
on:
  push:
    paths:
      - src/**
      - deploy/**
      - fly.toml
      - Dockerfile
      - .github/workflows/deploy.yml
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.toml --app usinsa-app --no-cache
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}