app = "usinsa-infra"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.infra"

[[services]]
  internal_port = 6379
  protocol = "tcp"
  [[services.ports]]
    port = 6379

[[services]]
  internal_port = 4080
  protocol = "tcp"
  [[services.ports]]
    port = 4080

[mounts]
  source = "infra_data"
  destination = "/data"

[[vm]]
  swap_size_mb = 256